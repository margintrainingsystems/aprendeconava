[build]
  publish = "."

# Seguridad básica para todo el sitio.
# Content-Security-Policy: el navegador solo acepta código, estilos, fuentes y
# conexiones de los orígenes que usa el sitio (Supabase, Google Fonts y el CDN
# de la librería de Supabase). Si algún día se suma Google Analytics u otra
# herramienta externa, hay que agregar su dominio acá (ver README).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://mryuhzpenzpyhfidwsup.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# La documentación viaja en el zip pero no se publica.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Archivo viejo que puede seguir en el repositorio: tampoco se publica.
[[redirects]]
  from = "/PENDIENTES.md"
  to = "/404.html"
  status = 404
  force = true
